name: Bias Board Diario

on:
  schedule:
    # 07:00 hora de España (peninsular) = 05:00 UTC en horario de verano,
    # 06:00 UTC en horario de invierno. Ajusta según la época del año,
    # o usa 06:00 UTC como término medio razonable.
    - cron: "0 6 * * 1-5"  # Lunes a viernes, 06:00 UTC
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde GitHub para probar

jobs:
  bias-board:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Bias Board
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          DISCORD_WEBHOOKBIAS_URL: ${{ secrets.DISCORD_WEBHOOKBIAS_URL }}
        run: python bias_board.py
