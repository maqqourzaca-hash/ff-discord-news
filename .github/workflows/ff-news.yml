name: Enviar noticias Forex Factory a Discord

on:
  schedule:
    # 8:00 hora de España (horario de verano, UTC+2).
    # En horario de invierno (finales de octubre a finales de marzo) cambia a "0 7 * * *" para que sigan siendo las 8:00.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FF_IMPACTS: "High,Medium,Holiday"
          FF_CURRENCIES: "EUR,GBP,USD"
          FF_TIMEZONE: "Europe/Madrid"
        run: python ff_news_discord.py
