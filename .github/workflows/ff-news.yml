name: Enviar noticias Forex Factory a Discord

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 UTC.
    # Ajusta la hora según prefieras (recuerda: está en UTC, no en tu zona horaria).
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  enviar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FF_IMPACTS: "High,Medium"
          FF_CURRENCIES: ""
          FF_TIMEZONE: "Europe/Madrid"
        run: python ff_news_discord.py
